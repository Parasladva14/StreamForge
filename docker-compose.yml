version: "3.9"

services:

  mysql:

    image: mysql:8

    container_name: streamforge-mysql

    restart: always

    environment:

      MYSQL_ROOT_PASSWORD: root

      MYSQL_DATABASE: streamforge

    ports:

      - "3306:3306"

    volumes:

      - mysql_data:/var/lib/mysql

  backend:

    build: ./backend

    container_name: streamforge-api

    depends_on:

      - mysql

    ports:

      - "8000:8000"

    volumes:

      - ./backend:/app

  frontend:

    build: ./frontend

    container_name: streamforge-ui

    depends_on:

      - backend

    ports:

      - "5173:5173"

    volumes:

      - ./frontend:/app

volumes:

  mysql_data: